server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/users/ {
    proxy_pass http://user-service:4001;
  }

  location /api/tasks/ {
    proxy_pass http://task-service:4002;
  }

  location /api/stats/ {
    proxy_pass http://stats-service:4003;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}