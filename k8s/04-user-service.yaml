apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: taskflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: taskflow-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: PORT
              value: "4001"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: MONGO_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: taskflow
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 4001
      targetPort: 4001