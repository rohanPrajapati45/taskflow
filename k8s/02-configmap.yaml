apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
data:
  NODE_ENV: production
  LOG_LEVEL: info
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  MONGO_DB_NAME: taskflow
  USER_SERVICE_URL: http://user-service:4001
  TASK_SERVICE_URL: http://task-service:4002
  CIRCUIT_BREAKER_TIMEOUT_MS: "3000"
  CIRCUIT_BREAKER_RESET_TIMEOUT_MS: "10000"
  CIRCUIT_BREAKER_ERROR_THRESHOLD_PERCENT: "50"
  CIRCUIT_BREAKER_VOLUME_THRESHOLD: "5"