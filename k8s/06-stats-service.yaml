apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
  namespace: taskflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stats-service
  template:
    metadata:
      labels:
        app: stats-service
    spec:
      containers:
        - name: stats-service
          image: taskflow-stats-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: PORT
              value: "4003"
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stats-service
  namespace: taskflow
spec:
  type: ClusterIP
  selector:
    app: stats-service
  ports:
    - port: 4003
      targetPort: 4003